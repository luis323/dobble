name: Compilar APK Android NUEVO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"
  GODOT_STATUS: stable

jobs:
  android:
    name: Godot oficial 4.4.1 → APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Descargar Godot y plantillas oficiales
        shell: bash
        run: |
          set -euo pipefail

          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          RELEASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"

          curl --fail --location --retry 4 \
            --output "$RUNNER_TEMP/godot.zip" \
            "$RELEASE_URL/${GODOT_FILE}.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/$GODOT_FILE"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/$GODOT_FILE" >> "$GITHUB_ENV"

          curl --fail --location --retry 4 \
            --output "$RUNNER_TEMP/templates.tpz" \
            "$RELEASE_URL/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates-unpacked"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/templates-unpacked/templates/." "$TEMPLATE_DIR/"

          test -x "$RUNNER_TEMP/godot/$GODOT_FILE"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/version.txt"

      - name: Configurar SDK y firma de depuración
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/debug_keystore = "%s"\n' "$DEBUG_KEYSTORE"
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.4.tres"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -f "$DEBUG_KEYSTORE"
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Importar proyecto
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Exportar APK con Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/SimbolosRelampago3D-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/SimbolosRelampago3D-debug.apk"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: SimbolosRelampago3D-Android
          path: build/SimbolosRelampago3D-debug.apk
          if-no-files-found: error
          retention-days: 30
